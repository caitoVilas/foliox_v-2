# Foliox local infrastructure (Task 2 — Foliox v2)
# Start: docker compose up -d   |   Stop: docker compose down   |   Reset (wipe data): docker compose down -v
# Variables: .env.example (copy to .env to override). Details: docs/infra.md
name: foliox

services:
  # ---------- PostgreSQL 16: one instance, one database per service ----------
  postgres:
    image: postgres:16
    container_name: foliox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foliox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-foliox}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs only on first boot (empty volume): creates the 6 per-service databases
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------- Kafka 4.3.1: single node, KRaft (Kafka 4.x removed ZooKeeper) ----------
  kafka:
    image: apache/kafka:4.3.1
    container_name: foliox-kafka
    restart: unless-stopped
    ports:
      # Host clients (Spring services on Windows) bootstrap localhost:9092
      - "9092:9092"
    environment:
      # --- KRaft combined mode (broker + controller in one process) ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@foliox-kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      # --- The #1 Kafka-in-Docker gotcha: advertised listeners ---
      # PLAINTEXT_HOST (9092) advertises localhost:9092  -> clients on the Windows host
      # PLAINTEXT      (19092) advertises kafka:19092    -> clients inside this compose network
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # --- Single-broker dev defaults (Kafka defaults assume 3 brokers) ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s

  # ---------- MinIO: S3 API for PDF storage (documents bucket) ----------
  # Image choice: MinIO deleted minio/minio + minio/mc from Docker Hub (Sep 2026)
  # and gated quay.io/minio behind login, so anonymous pulls of upstream images fail.
  # bitnamilegacy is Bitnami's public, immutable mirror of the last OSS releases
  # (MinIO RELEASE.2025-07-23). Tag is pinned (repository tags are immutable).
  # Bucket creation: this image natively supports MINIO_DEFAULT_BUCKETS
  # (idempotent, runs once the server is healthy) — no init container needed.
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: foliox-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-foliox}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-foliox12345}
      MINIO_DEFAULT_BUCKETS: ${MINIO_DEFAULT_BUCKET:-documentos}
      # Fixed by the image (defaults shown): MINIO_API_PORT_NUMBER=9000,
      # MINIO_CONSOLE_PORT_NUMBER=9001, data dir /bitnami/minio/data
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  postgres_data:
  kafka_data:
  minio_data:
